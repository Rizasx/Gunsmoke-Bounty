<!doctype html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#140d0a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta charset="utf-8">
<title>Gunsmoke Bounty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Rye&family=Special+Elite&display=swap">
<style>
/* Layout concept: one full-bleed canvas, brass-and-leather menus layered on a dusk sky */
:root{
  --bg:#140d0a; --bg2:#25170f; --panel:#33231a; --panel2:#463022; --line:#765232;
  --fg:#f7e9cc; --dim:#c4a77d; --brass:#f2bf55; --brass2:#b57c1a;
  --red:#e0502f; --green:#a3bd5e; --blue:#6fb0dc; --teal:#4fb8a8; --ember:#f28a3a; --paper:#ecdcb2; --ink:#2b1c10;
  --display:'Rye',Georgia,serif; --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 17px/1.25 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig,#deVig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
#vig{background:radial-gradient(ellipse at center,transparent 42%,rgba(200,30,20,.8) 100%)}
#deVig{background:radial-gradient(ellipse at center,transparent 35%,rgba(40,20,0,.75) 100%)}
#deVig.on{opacity:1}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{position:absolute}
#hudL{left:12px;top:10px;width:min(210px,42vw);display:grid;gap:5px}
.bar{position:relative;height:20px;background:rgba(10,6,3,.62);border:2px solid rgba(0,0,0,.7);border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left center;transition:transform .12s}
.bar.hp i{background:linear-gradient(#e0553d,#a82d1d)}
.bar.de{height:13px}
.bar.de i{background:linear-gradient(#f0c764,#c18a1d)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.14em;text-shadow:0 1px 2px #000}
#hudC{left:50%;top:8px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 4px #000}
#waveT{font-family:var(--display);font-size:22px;color:var(--brass);letter-spacing:.04em}
#foesT{font-size:15px;color:var(--fg);opacity:.9}
#hudR{right:12px;top:8px;text-align:right;text-shadow:0 2px 4px #000}
#moneyT{font-size:30px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1}
#streakT{font-size:16px;color:#ffd77a;min-height:18px;font-weight:600}
#pauseB{pointer-events:auto;z-index:7;right:12px;top:58px;width:40px;height:34px;background:rgba(10,6,3,.6);border:2px solid var(--line);border-radius:3px;font-weight:700;font-size:15px;letter-spacing:.1em}
#hudB{left:50%;bottom:12px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 4px #000;white-space:nowrap}
#wepT{font-size:16px;letter-spacing:.08em;text-transform:uppercase;opacity:.95}
#ammoT{font-size:24px;font-weight:700;letter-spacing:.12em;color:var(--brass);min-height:28px;font-variant-numeric:tabular-nums}
#ammoT b{font-weight:700;color:var(--dim)}
#ammoT em{font-style:normal;color:var(--red)}
#keysT{font-size:13px;color:var(--dim);margin-top:2px}
#bossbar{left:50%;top:58px;transform:translateX(-50%);width:min(520px,60vw);text-align:center}
#bossn{font-family:var(--type);font-size:14px;letter-spacing:.06em;color:var(--paper);text-shadow:0 2px 3px #000;margin-bottom:3px}
.bar.boss{height:14px}
.bar.boss i{background:linear-gradient(#d65a40,#8e2214)}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--display);font-size:clamp(30px,8vw,66px);color:var(--brass);text-shadow:0 3px 0 #4d3208,0 8px 18px rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:6;padding:0 16px}
#banner.show{animation:ban 2.3s ease both}
@keyframes ban{0%{opacity:0;transform:scale(1.35)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);max-width:88vw;background:rgba(18,11,6,.88);border:2px solid var(--line);padding:8px 14px;border-radius:3px;font-size:17px;opacity:0;pointer-events:none;z-index:60;text-align:center}
#toast.show{animation:tst 2.6s ease both}
@keyframes tst{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
/* touch */
#touch{position:absolute;inset:0;z-index:5;touch-action:none}
.stick{position:fixed;width:124px;height:124px;border-radius:50%;border:2px solid rgba(241,227,198,.4);background:rgba(10,6,3,.3);display:none;pointer-events:none}
.stick.on{display:block}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(230,179,74,.65);border:2px solid rgba(255,255,255,.4)}
.zhint{position:absolute;bottom:26px;width:110px;height:110px;border-radius:50%;border:2px dashed rgba(241,227,198,.22);display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.14em;color:rgba(241,227,198,.4);pointer-events:none}
#zL{left:22px}#zR{right:22px}
#tbtns{position:absolute;right:12px;bottom:150px;display:grid;grid-template-columns:repeat(2,62px);gap:10px}
#tbtns button{position:relative;width:62px;height:62px;border-radius:50%;background:rgba(20,12,6,.72);border:2px solid var(--brass2);font-size:12px;font-weight:700;letter-spacing:.06em;line-height:1.05;text-align:center;padding:0;touch-action:none}
#tbtns button b{position:absolute;right:-2px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--brass);color:#201208;font-size:12px;line-height:20px}
#bDE{background:conic-gradient(var(--brass) var(--de,0%),rgba(20,12,6,.72) 0)}
#bDE span{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;background:rgba(20,12,6,.9);margin:auto}
@media (max-height:480px){#tbtns{bottom:96px;grid-template-columns:repeat(3,52px)}#tbtns button{width:52px;height:52px;font-size:11px}}
/* screens */
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.btn{background:linear-gradient(var(--brass),var(--brass2));color:#201208;border:0;border-radius:3px;padding:11px 18px;font:700 19px var(--body);letter-spacing:.07em;text-transform:uppercase;box-shadow:0 3px 0 #5b3d0d;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5b3d0d}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:7px 12px;font-size:16px}
.btn[disabled]{opacity:.42;pointer-events:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* title */
#sTitle{background:linear-gradient(#241632 0%,#6d3340 38%,#d9743a 66%,#f1b95f 80%,#2d1c11 80.1%)}
#sTitle .sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sTitle .sky svg{position:absolute;left:0;bottom:0;width:100%;height:46%}
.tw{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:clamp(18px,5vh,48px) 16px 22px;gap:14px;overflow-y:auto;touch-action:pan-y}
.kick{font-family:var(--type);letter-spacing:.2em;font-size:13px;color:#f4d9a6;opacity:.9;text-align:center}
.logo{font-family:var(--display);font-size:clamp(40px,12vw,88px);line-height:.95;text-align:center;color:var(--brass);text-shadow:0 3px 0 #5b3a0c,0 8px 0 #2b1a07,0 16px 28px rgba(0,0,0,.55);margin:0;text-wrap:balance}
.tag{max-width:30em;text-align:center;font-size:19px;color:#fbe9c8;text-shadow:0 2px 4px rgba(0,0,0,.6);margin:0}
.stack{display:grid;gap:10px;width:min(420px,100%)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:min(760px,100%)}
.role{background:rgba(21,15,11,.9);border:2px solid var(--line);border-radius:3px;padding:14px 12px 14px;text-align:left;cursor:pointer;display:grid;gap:6px;min-width:0}
.role:hover,.role:focus-visible{border-color:var(--brass)}
.role svg{position:static;width:40px;height:40px;fill:none;stroke:var(--brass);stroke-width:2.4}
.role h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--brass)}
.role p{margin:0;font-size:17px;color:var(--fg)}
.role small{font-family:var(--type);font-size:13px;color:var(--dim)}
.mini{font-size:15px;color:#fbe9c8;text-shadow:0 1px 3px #000;text-align:center}
.mini button{background:none;border:0;text-decoration:underline;font-size:15px;cursor:pointer;padding:6px}
/* town */
.thead{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:2px solid var(--line);flex-wrap:wrap}
.thead h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--brass);flex:1;min-width:150px}
.thead .m{font-size:28px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums}
.thead .h{font-size:15px;color:var(--dim)}
.tabs{display:flex;background:var(--bg2);border-bottom:2px solid var(--line)}
.tabs button{flex:1;padding:11px 4px;background:none;border:0;border-bottom:4px solid transparent;font:700 17px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.tabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.tbody{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tfoot{display:flex;gap:10px;padding:10px 16px;background:var(--bg2);border-top:2px solid var(--line)}
.tfoot .btn:first-child{flex:1}
.sum{background:var(--paper);color:var(--ink);font-family:var(--type);padding:12px 14px;border:5px double #6a4a25;display:grid;gap:3px;font-size:15px}
.sum b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em}
.sum .row{display:flex;justify-content:space-between;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.card h4{margin:0;font-size:20px;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card p{margin:0;color:var(--dim);font-size:16px}
.card.eq{border-color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sh{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:17px;color:var(--brass);letter-spacing:.05em}
.stat{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:13px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.stat i{display:block;height:7px;background:#0006;position:relative}
.stat i u{position:absolute;inset:0 auto 0 0;background:var(--brass)}
.rowb{display:flex;gap:8px;flex-wrap:wrap}
.price{color:var(--brass);font-variant-numeric:tabular-nums;font-weight:700}
/* skill tree */
.brs{display:flex;gap:8px}
.brs button{flex:1;padding:9px 4px;background:var(--panel);border:2px solid var(--line);border-radius:3px;font:700 17px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tgrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px;padding:6px 0}
.tgrid svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tgrid path{fill:none;stroke:var(--line);stroke-width:4}
.tgrid path.on{stroke:var(--bc,var(--brass))}
.tnode{position:relative;min-height:70px;min-width:0;background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:6px 4px;display:grid;align-content:center;gap:3px;text-align:center;cursor:pointer;z-index:1}
.tnode b{font-size:15px;line-height:1.05}
.tnode span{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.tnode.lock{opacity:.45}
.tnode.max{border-color:var(--bc);background:#3b2c1a}
.tnode.sel{outline:3px solid var(--fg);outline-offset:1px}
.tnode.can{border-color:var(--bc)}
.detail{border:2px solid var(--line);background:var(--panel);padding:10px 12px;display:grid;gap:6px;border-radius:3px}
.detail h4{margin:0;font-size:22px;font-family:var(--display);font-weight:400;color:var(--brass)}
.detail p{margin:0;font-size:17px}
/* duel + over + pause */
.duel,.over,.pause{background:rgba(10,6,3,.82);align-items:center;justify-content:center;padding:16px;gap:14px;text-align:center}
.poster{width:min(360px,100%);background:var(--paper);color:var(--ink);font-family:var(--type);border:6px double #6a4a25;padding:16px 14px;display:grid;gap:6px;transform:rotate(-1.2deg);box-shadow:0 10px 30px rgba(0,0,0,.55)}
.poster h2{margin:0;font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:.06em;line-height:1}
.poster .nm{font-size:22px;font-weight:700}
.poster .bn{font-family:var(--display);font-size:30px}
.poster p{margin:0;font-size:14px}
#drawBtn{width:min(360px,100%);height:150px;border:0;border-radius:3px;background:#3a2a1a;font-family:var(--display);font-size:46px;color:var(--fg);cursor:pointer;letter-spacing:.06em}
#drawBtn.go{background:var(--red);color:#fff;animation:pop .15s}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
.duel .msg{font-size:20px;min-height:26px;color:var(--fg)}
.panel{width:min(420px,100%);background:var(--panel);border:2px solid var(--line);padding:18px 16px;display:grid;gap:10px;border-radius:3px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--brass)}
.panel p{margin:0;color:var(--fg);font-size:18px}
/* duel mode */
.screen.df{background:transparent;touch-action:none;padding:10px 12px}
.dft{display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.dfc{width:min(240px,44vw);display:grid;gap:4px;text-shadow:0 2px 4px #000;font-size:18px}
.dfc.r{text-align:right}.dfc small{font-family:var(--type);font-size:12px;color:var(--dim)}
#dfBig{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--display);font-size:clamp(46px,15vw,130px);line-height:1;color:var(--brass);text-shadow:0 4px 0 #4d3208,0 10px 24px rgba(0,0,0,.6);pointer-events:none;padding:0 12px}
#dfSub{position:absolute;left:0;right:0;top:calc(24% + clamp(56px,17vw,140px));text-align:center;font-size:21px;letter-spacing:.06em;text-shadow:0 2px 5px #000;pointer-events:none}
.dfb{position:absolute;left:12px;right:12px;bottom:calc(14px);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
#dfAmmo{font-size:24px;font-weight:700;letter-spacing:.12em;color:var(--brass);text-shadow:0 2px 4px #000;text-align:center;flex:1}
#dfAmmo b{color:var(--dim)}#dfAmmo em{font-style:normal;color:var(--red)}
#dfPanel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:rgba(10,6,3,.62);z-index:2;text-align:center}
#dfPanel:empty{display:none}
.tfoot .btn{flex:1}.tfoot .btn.ghost{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){#banner.show,#toast.show,#drawBtn.go{animation-duration:.01s}}

/* ---- v4 look: leather, brass and sun ---- */
[hidden]{display:none!important}
body{background:radial-gradient(ellipse at 50% 0%,#2a1a10,var(--bg) 70%)}
.btn{background:linear-gradient(#ffd377 0%,var(--brass) 45%,var(--brass2) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 0 #5b3d0d,0 6px 14px rgba(0,0,0,.35);border-radius:5px}
.btn:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #5b3d0d}
.btn.ghost{background:rgba(20,12,8,.5);border:2px solid var(--line);border-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn.ghost:hover{border-color:var(--brass)}
#hudL,#hudC,#hudR{padding:7px 10px;background:linear-gradient(rgba(35,22,14,.72),rgba(18,10,6,.72));border:1px solid rgba(242,191,85,.3);border-bottom:3px solid var(--brass2);border-radius:6px;backdrop-filter:blur(3px)}
#hudC{padding:5px 18px 6px}
#hudR{top:8px}
#pauseB{top:92px;background:linear-gradient(rgba(35,22,14,.8),rgba(18,10,6,.8));border-color:var(--brass2);border-radius:6px}
#bossbar{top:88px}
#clockT{font-size:14px;color:var(--ember);letter-spacing:.06em;margin-top:1px}
.bar{border-radius:4px;border-color:#000;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.bar.hp i{background:linear-gradient(#f0694a,#b0301c)}
.bar.de i{background:linear-gradient(#ffd982,#d19420)}
#waveT{text-shadow:0 2px 0 #4d3208}
/* title */
#sTitle{background:linear-gradient(#241632 0%,#6d3340 38%,#d9743a 66%,#f1b95f 80%,#2d1c11 80.1%)}
.kick{font-size:15px;color:#ffe3ae;letter-spacing:.14em;padding:4px 14px;border:1px solid rgba(255,227,174,.35);border-radius:20px;background:rgba(20,10,8,.35);font-family:var(--type)}
.logo{background:linear-gradient(#ffe29a 10%,#f2bf55 45%,#c07f1c 85%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #4d2f08) drop-shadow(0 12px 18px rgba(0,0,0,.55))}
.role{background:linear-gradient(160deg,rgba(60,40,26,.94),rgba(24,15,10,.96));border:2px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 4px rgba(20,10,5,.5),inset 0 0 0 5px rgba(242,191,85,.18),0 10px 22px rgba(0,0,0,.4);transition:transform .15s,border-color .15s}
.role:hover,.role:focus-visible{transform:translateY(-3px);border-color:var(--brass)}
.role:nth-child(1) svg{stroke:var(--blue)}.role:nth-child(1) h3{color:#9cc9e8}
.role:nth-child(2) svg{stroke:var(--ember)}.role:nth-child(2) h3{color:var(--ember)}
.role:nth-child(3) svg{stroke:var(--teal)}.role:nth-child(3) h3{color:#7fd4c6}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
.opts button{background:rgba(20,10,8,.55);border:1px solid rgba(255,227,174,.35);border-radius:20px;padding:6px 14px;font-size:15px;color:#ffe9c4;cursor:pointer}
.opts button:hover{border-color:var(--brass);color:var(--brass)}
/* town */
.thead{background:linear-gradient(#4a301d,#2e1d12);border-bottom:3px solid var(--brass2);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.tabs{background:#25170f;border-bottom:1px solid var(--line)}
.tabs button.on{color:var(--brass);background:linear-gradient(transparent,rgba(242,191,85,.14))}
.tbody{background:radial-gradient(ellipse at 50% -10%,rgba(242,191,85,.07),transparent 60%)}
.tfoot{background:linear-gradient(#2e1d12,#1d120b);border-top:3px solid var(--brass2)}
.card,.detail,.panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:7px;box-shadow:inset 0 0 0 4px rgba(20,10,5,.35),inset 0 0 0 5px rgba(242,191,85,.14),0 6px 14px rgba(0,0,0,.3)}
.card.eq{border-color:var(--brass);box-shadow:inset 0 0 0 4px rgba(20,10,5,.35),inset 0 0 0 5px rgba(242,191,85,.4),0 0 18px rgba(242,191,85,.18)}
.tnode{border-radius:9px;background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:0 3px 8px rgba(0,0,0,.35)}
.tnode.can{box-shadow:0 0 14px color-mix(in srgb,var(--bc) 55%,transparent),0 3px 8px rgba(0,0,0,.35)}
.tnode.max{background:linear-gradient(160deg,#5a4020,#3b2a16)}
.brs button{border-radius:7px;background:linear-gradient(var(--panel2),var(--panel))}
.sum{border-radius:3px;background:linear-gradient(#f1e3bc,#e2cf9f)}
.poster{background:linear-gradient(#f1e3bc,#e0cc9a);border-radius:3px}

function tickClock(dt){

 if(TM.mode==='fast')TM.h=(TM.h+dt*24/720)%24;
 else if(TM.mode==='live'){const d=new Date();TM.h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;}

function fmtClock(h){h=((h%24)+24)%24;const hh=Math.floor(h),mm=Math.floor((h-hh)*60);return(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;}
function phaseName(h){return h<4.5?'Night':h<6?'Before dawn':h<7.5?'Sunrise':h<11?'Morning':h<14?'Midday':h<17?'Afternoon':h<18.5?'Golden hour':h<19.5?'Sunset':h<21?'Dusk':'Night';}

const TOD=[

 [12,255,250,240,0],[16,255,236,205,0],[17.8,255,190,120,.1],[19,200,120,130,.5],[20.3,125,118,172,.9],[22,106,120,176,1],[24,104,120,178,1]
];
const SKYK=[
 [0,'#070b1f','#0f1a3a','#1e2c55'],[4.8,'#0b1230','#252b5a','#4a416c'],[5.9,'#35448a','#bd6f8c','#f4a869'],
 [7.6,'#4f86c8','#8fb8de','#f6d9a0'],[12,'#2f7fd0','#6fb0e8','#cfe6f4'],[16.5,'#3d86cf','#86b7de','#f0dca8'],

];
function hex3(s){const n=parseInt(s.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function keyAt(arr,h,conv){
 for(let i=0;i<arr.length-1;i++){
  const a=arr[i],b=arr[i+1];
  if(h>=a[0]&&h<=b[0]){const f=(h-a[0])/(b[0]-a[0]||1),s=f*f*(3-2*f);return conv(a,b,s);}
 }
 return conv(arr[0],arr[0],0);
}
function todTint(){
 let t=keyAt(TOD,TM.h,(a,b,s)=>[0,1,2].map(i=>Math.round(a[i+1]+(b[i+1]-a[i+1])*s)));
 const m=WXMUL[WX.kind];if(m)t=t.map((v,i)=>Math.round(v*m[i]));
 if(WX.flash>0)t=t.map(v=>Math.min(255,Math.round(v+WX.flash*320)));
 return t;
}
function darkAmt(){return keyAt(TOD,TM.h,(a,b,s)=>a[4]+(b[4]-a[4])*s);}
function tintCss(){const t=todTint();return'rgb('+t[0]+','+t[1]+','+t[2]+')';}
function skyCols(){
 return keyAt(SKYK,TM.h,(a,b,s)=>[1,2,3].map(i=>{const p=hex3(a[i]),q=hex3(b[i]);return'rgb('+[0,1,2].map(k=>Math.round(p[k]+(q[k]-p[k])*s)).join(',')+')';}));
}
function litColor(hex){const t=todTint(),c=hex3(hex);return'rgb('+Math.round(c[0]*t[0]/255)+','+Math.round(c[1]*t[1]/255)+','+Math.round(c[2]*t[2]/255)+')';}
/* sun or moon arc: returns {x:0..1, y:0..1 height, sun:bool} */
function bodyArc(){
 const h=TM.h,isSun=h>=5.8&&h<18.6;
 let p;if(isSun)p=(h-5.8)/12.8;else p=((h>=18.6?h-18.6:h+5.4))/11.6;
 p=clamp(p,0,1);return{x:p,y:Math.sin(p*Math.PI),sun:isSun};
}
function sunShadow(){
 const h=TM.h;let a,A;
 if(h>=6&&h<18){a=(h-6)/12*Math.PI;A=.34;}else{a=(((h+24-18)%24)/12)*Math.PI;A=.12;}
 const el=Math.max(0,Math.sin(a));
 return{ex:-Math.cos(a),el,A:A*Math.min(1,el*3.2)};
}

/* ---------- shadows and light ---------- */
const OHEIGHT={tree:72,bld:74,rock:30,barrel:18,post:22,cactus:30,pine:84,bush:14,crate:16,wagon:22,trough:8,cart:14,table:14};
function hull(pts){
 pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
 const lo=[],up=[];
 for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
 for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
 lo.pop();up.pop();return lo.concat(up);
}
function drawShadows(c,M,x0,y0,x1,y1){
 if(M.indoor)return;
 const sh=sunShadow();if(sh.A<.01)return;
 c.fillStyle='rgba(12,8,24,'+sh.A.toFixed(3)+')';
 for(const o of M.obs){
  if(o.x>x1+160||o.x+o.w<x0-160||o.y>y1+160||o.y+o.h<y0-160)continue;
  const hgt=OHEIGHT[o.t]||14,k=(.25+1.15*(1-sh.el))*hgt,dx=sh.ex*k,dy=hgt*.2+k*.12;
  c.beginPath();
  if(o.t==='barrel'||o.t==='post'||o.t==='cactus'||o.t==='pine'||o.t==='bush'||o.t==='rock'||o.t==='tree'){
   const r=o.w/2,cx=o.x+r,cy=o.y+o.h/2;
   c.ellipse(cx+dx*.55,cy+dy*.55+3,r+Math.abs(dx)*.5,o.h/2*.9+Math.abs(dy)*.5,0,0,7);
  }else{
   const P=[[o.x,o.y],[o.x+o.w,o.y],[o.x+o.w,o.y+o.h],[o.x,o.y+o.h]];
   const pts=P.concat(P.map(p=>[p[0]+dx,p[1]+dy])),H=hull(pts);
   H.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  }
  c.fill();
 }
}
function glowAmt(){return clamp((darkAmt()-.25)/.6,0,1);}
function drawLights(c,M,x0,y0,x1,y1){
 const g=glowAmt();if(g<.02)return;
 c.globalCompositeOperation='screen';
 for(const L of M.lamps){
  if(L.x<x0-130||L.x>x1+130||L.y<y0-130||L.y>y1+130)continue;
  const fl=.94+Math.sin(TM.t*7+L.x)*.04,r=105,gr=c.createRadialGradient(L.x,L.y,2,L.x,L.y,r);
  gr.addColorStop(0,'rgba(255,196,100,'+(.2*g*fl).toFixed(3)+')');gr.addColorStop(.5,'rgba(255,165,70,'+(.05*g).toFixed(3)+')');gr.addColorStop(1,'rgba(255,150,50,0)');
  c.fillStyle=gr;c.fillRect(L.x-r,L.y-r,r*2,r*2);
 }
 for(const o of M.obs){
  if(o.t!=='bld'||o.x>x1||o.x+o.w<x0||o.y>y1||o.y+o.h<y0)continue;
  const edge=o.bottom?o.y:o.y+o.h,dir=o.bottom?-1:1;
  for(const p of winPos(o)){
   c.fillStyle='rgba(255,196,100,'+(.5*g).toFixed(3)+')';c.fillRect(p.x+1,p.y+1,20,24);
   const gr=c.createLinearGradient(0,edge,0,edge-dir*-40);
   gr.addColorStop(0,'rgba(255,180,80,'+(.08*g).toFixed(3)+')');gr.addColorStop(1,'rgba(255,170,70,0)');
   c.fillStyle=gr;c.fillRect(p.x-4,o.bottom?edge-40:edge,30,40);
  }
 }
 c.globalCompositeOperation='source-over';
}
function drawSnow(c,W,H,sc){

 for(let i=0;i<110;i++){
  const sz=(1+(i%3)*.8)*sc,x=((i*73.7+Math.sin(t*.6+i)*26*sc+t*(10+i%7)*sc)%W+W)%W,y=((i*131.3+t*(34+(i%5)*12)*sc)%H+H)%H;
  c.fillRect(x,y,sz,sz);
 }
}

function drawSky(c,W,H,hz){
 const s=skyCols(),g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,s[0]);g.addColorStop(.6,s[1]);g.addColorStop(1,s[2]);
 c.fillStyle=g;c.fillRect(0,0,W,hz);

 if(d>.2){c.fillStyle='rgba(255,255,255,'+(d*.85).toFixed(2)+')';const R=rng(77);for(let i=0;i<80;i++){const tw=.6+.4*Math.sin(TM.t*2+i);c.globalAlpha=tw*d;c.fillRect(R()*W,R()*hz*.75,1.6,1.6);}c.globalAlpha=1;}
 const b=bodyArc(),bx=W*(.08+.84*b.x),by=hz-(hz*.82)*b.y,r=Math.min(W,H)*(b.sun?.075:.05);
 if(b.sun){
  const gr=c.createRadialGradient(bx,by,r*.4,bx,by,r*4);gr.addColorStop(0,'rgba(255,230,160,.55)');gr.addColorStop(1,'rgba(255,200,120,0)');c.fillStyle=gr;c.fillRect(bx-r*4,by-r*4,r*8,r*8);
  c.fillStyle='#fff3c4';c.beginPath();c.arc(bx,by,r,0,7);c.fill();
 }else{
  c.fillStyle='#e8ecff';c.beginPath();c.arc(bx,by,r,0,7);c.fill();
  c.fillStyle='rgba(20,30,70,.9)';c.beginPath();c.arc(bx+r*.42,by-r*.1,r*.92,0,7);c.fill();
 }
 const day=1-d;
 if(day>.1){
  c.fillStyle='rgba(255,255,255,'+(.5*day).toFixed(2)+')';
  for(let i=0;i<4;i++){const cx=((i*0.31*W+TM.t*(6+i*3))%(W+240))-120,cy=hz*(.18+i*.13);
   for(let k=0;k<4;k++){c.beginPath();c.ellipse(cx+k*26-40,cy+(k%2)*6,36-k*3,13,0,0,7);c.fill();}}
 }
}

function pickWeather(sc){
 const t={town:[['rain',.18],['storm',.08]],canyon:[['sand',.22]],prairie:[['rain',.3],['storm',.2]],desert:[['sand',.4]],mine:[['rain',.15]],swamp:[['rain',.4],['storm',.15]],border:[['sand',.2]],river:[['rain',.25],['storm',.1]],mesa:[['sand',.3]],ghost:[['sand',.25]],gold:[['rain',.2]],fort:[['sand',.15]]}[sc.id]||[];
 let a=0;const r=Math.random();for(const q of t){a+=q[1];if(r<a)return q[0];}return'clear';
}
function setWeather(sc){WX.kind=sc.snow?'snow':pickWeather(sc);WX.flash=0;WX.next=3+Math.random()*5;}
function drawWeather(c,W,H,sc){
 const t=TM.t,k=WX.kind;
 if(k==='snow')drawSnow(c,W,H,sc);
 else if(k==='rain'||k==='storm'){
  const n=k==='storm'?230:130;c.strokeStyle='rgba(205,220,245,'+(k==='storm'?.42:.32)+')';c.lineWidth=1.3*sc;c.beginPath();
  for(let i=0;i<n;i++){const x=((i*97.3+t*110*sc)%(W+80)+W+80)%(W+80)-40,y=((i*57.7+t*(900+(i%5)*120)*sc)%H+H)%H;c.moveTo(x,y);c.lineTo(x-7*sc,y+22*sc);}
  c.stroke();
 }else if(k==='sand'){
  c.fillStyle='rgba(214,160,92,.2)';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(240,205,150,.4)';c.lineWidth=1.4*sc;c.beginPath();
  for(let i=0;i<80;i++){const x=((i*131+t*900*sc)%(W+200)+W+200)%(W+200)-100,y=(i*61.7+Math.sin(t+i)*10)%H;c.moveTo(x,y);c.lineTo(x-60*sc,y+3*sc);}
  c.stroke();
 }
 if(WX.flash>0){c.fillStyle='rgba(235,240,255,'+Math.min(.6,WX.flash*1.4).toFixed(2)+')';c.fillRect(0,0,W,H);}

/* ---------- maps ---------- */
const PR=1.25;
const SIGNS=['SALOON','SHERIFF','BANK','GENERAL STORE','HOTEL','SMITHY','UNDERTAKER','TELEGRAPH','BARBER','LIVERY'];
function buildMap(wave){
 const kind=sceneFor(Math.floor((wave-1)/2));
 const R=rng(wave*7919+kind.id.charCodeAt(0)*31+kind.id.length);
 const big=save.horse>0;
 const M={kind,w:big?2500:1800,h:big?1500:1300,obs:[],lamps:[],name:kind.name};
 const band=bottom=>{let x=36;while(x<M.w-170){
  const bw=Math.round(290+R()*150),bh=Math.round(255+R()*70);
  if(x+bw>M.w-30)break;
  if(R()<.1){x+=140;continue;}
  M.obs.push({x,y:bottom?M.h-34-bh:34,w:bw,h:bh,t:({canyon:1,crater:1,alienworld:1,grave:1,gold:1})[kind.id]?'rock':'bld',v:Math.floor(R()*4),sign:SIGNS[Math.floor(R()*SIGNS.length)],bottom});
  x+=bw+Math.round(20+R()*36);}};
 band(false);band(true);
 const types=kind.types;
 const sz={crate:[34,34],barrel:[28,28],wagon:[96,50],trough:[74,28],post:[14,14],cactus:[26,26],rock:[60,52],cart:[70,42],pine:[34,34],bush:[30,30],tree:[38,38]};
 let tries=0;
 while(M.obs.length<(big?54:34)&&tries++<500){
  const t=types[Math.floor(R()*types.length)];let w=sz[t][0],h=sz[t][1];
  if(t==='rock'){w=Math.round(46+R()*60);h=Math.round(40+R()*56);}
  if(t==='pine'){w=h=Math.round(40+R()*14);}else if(t==='tree'){w=h=Math.round(32+R()*14);}
  const x=Math.round(110+R()*(M.w-220-w)),y=Math.round(290+R()*(M.h-580-h));
  if(x<M.w/2+150&&x+w>M.w/2-150&&y<M.h/2+130&&y+h>M.h/2-130)continue;
  if(M.obs.some(o=>x<o.x+o.w+46&&x+w>o.x-46&&y<o.y+o.h+46&&y+h>o.y-46))continue;
  M.obs.push({x,y,w,h,t,v:Math.floor(R()*4)});
 }
 if(kind.lamps)for(let i=0;i<(big?9:6);i++)M.lamps.push({x:230+i*(big?270:300)+R()*30,y:M.h/2+(i%2?-176:176)});
 M.bg=renderBG(M,R);
 return M;
}
function renderBG(M,R){
 const k=M.kind,cv2=document.createElement('canvas');cv2.width=Math.round(M.w*PR);cv2.height=Math.round(M.h*PR);

function segRect(x1,y1,x2,y2,r){
 let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
 for(let i=0;i<2;i++){
  const p=i?dy:dx,q=i?y1-r.y:x1-r.x,mx=i?r.h:r.w;
  if(Math.abs(p)<1e-9){if(q<0||q>mx)return-1;}
  else{let ta=-q/p,tb=(mx-q)/p;if(ta>tb){const s=ta;ta=tb;tb=s;}if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t0>t1)return-1;}
 }
 return t0;
}
function clearLine(x1,y1,x2,y2){const o=G.map.obs;for(let i=0;i<o.length;i++)if(segRect(x1,y1,x2,y2,o[i])>=0)return false;return true;}
function segCircle(x1,y1,x2,y2,cx,cy,r){
 const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2?((cx-x1)*dx+(cy-y1)*dy)/l2:0;t=clamp(t,0,1);
 const px=x1+dx*t-cx,py=y1+dy*t-cy;return px*px+py*py<r*r?t:-1;
}
function resolve(e){
 const o=G.map.obs;
 for(let i=0;i<o.length;i++){
  const b=o[i];
  if(e.x<b.x-e.r||e.x>b.x+b.w+e.r||e.y<b.y-e.r||e.y>b.y+b.h+e.r)continue;
  const cx=clamp(e.x,b.x,b.x+b.w),cy=clamp(e.y,b.y,b.y+b.h),dx=e.x-cx,dy=e.y-cy,d2=dx*dx+dy*dy;
  if(d2<e.r*e.r){
   if(d2>.0001){const d=Math.sqrt(d2),k=(e.r-d)/d;e.x+=dx*k;e.y+=dy*k;}
   else{const l=e.x-b.x,rr=b.x+b.w-e.x,t=e.y-b.y,bt=b.y+b.h-e.y,m=Math.min(l,rr,t,bt);
    if(m===l)e.x=b.x-e.r;else if(m===rr)e.x=b.x+b.w+e.r;else if(m===t)e.y=b.y-e.r;else e.y=b.y+b.h+e.r;}
  }
 }
 e.x=clamp(e.x,e.r,G.map.w-e.r);e.y=clamp(e.y,e.r,G.map.h-e.r);
}

function winPos(o){const wy=o.bottom?o.y+o.h*.5:o.y+o.h*.22;return[.1,.26,.66,.82].map(f=>({x:Math.round(o.x+o.w*f),y:Math.round(wy)}));}

function bossAttack(e,dt,d){
 const B=ETYPES.boss,enr=e.hp<e.maxHp*.5,p=G.player;
 if(!e.pat){
  e.cd-=dt;
  if(e.cd<=0&&e.los){e.pat=bossPick(e);if(e.pat==='summon'&&G.enemies.length>7)e.pat='fan';e.stage=0;e.pt=e.pat==='summon'?.9:e.pat==='snipe'?1.15:.55;e.n=e.bk==='gatling'?(enr?18:12):(enr?8:5);}
  return;
 }
 e.pt-=dt;
 if(e.stage===0){
  if(e.pt>.12)e.aim=Math.atan2(p.y-e.y,p.x-e.x);
  if(e.pt<=0){
   e.stage=1;e.pt=0;
   if(e.pat==='fan'){for(let i=-3;i<=3;i++)shootE(e,e.aim+i*.15,B.dmg*dmgScale(),470);SFX.enemyShot(1.4);e.pat=null;e.cd=enr?1.3:2.1;}
   else if(e.pat==='summon'){for(let i=0;i<2;i++)G.enemies.push(makeEnemy(pickType(save.wave),clamp(e.x+(i?70:-70),40,G.map.w-40),e.y+40,{minion:1,fac:e.fac}));ftext(e.x,e.y-50,'REINFORCEMENTS','#ff9a7a',18,1.4);e.pat=null;e.cd=3.2;}
   else if(e.pat==='snipe'){shootE(e,e.aim,B.dmg*dmgScale()*2.6,1150);SFX.enemyShot(1.6);e.pat=null;e.cd=enr?1.6:2.4;}
   else if(e.pat==='bomb'){for(let i=0;i<(e.bk==='dynamite'?5:3);i++)throwBomb(e,p.x+rand(-90,90),p.y+rand(-90,90));e.pat=null;e.cd=enr?1.6:2.5;}
  }
 }else if(e.pat==='burst'&&e.pt<=0){
  if(e.n>0){e.n--;e.pt=.13;shootE(e,e.aim+(Math.random()-.5)*.1,B.dmg*dmgScale(),640);SFX.enemyShot(1);}
  else{e.pat=null;e.cd=enr?1.2:2;}
 }
}
function updEnemy(e,dt){
 const p=G.player,T=ETYPES[e.type];
 e.t+=dt;e.flash=Math.max(0,e.flash-dt);
 const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ax=dx/d,ay=dy/d;
 e.ang=Math.atan2(dy,dx);
 if(e.lead&&leadSurr(e,dt,d))return;
 if(e.stun>0){e.stun-=dt;e.windup=0;return;}
 if(e.type==='brawler'){updBrawler(e,dt,d,ax,ay);return;}
 e.losT-=dt;if(e.losT<=0){e.los=clearLine(e.x,e.y,p.x,p.y);e.losT=.2;}
 const busy=e.windup>0||(e.type==='boss'&&e.pat&&e.stage===0);
 let mx=0,my=0;
 if(e.stuck>0){e.stuck-=dt;mx=e.sx;my=e.sy;}
 else{
  if(d>e.pref+50||!e.los){mx=ax;my=ay;}else if(d<e.pref-60){mx=-ax;my=-ay;}
  if(e.los){const s=Math.sin(e.t*.9+e.ph)>0?1:-1;mx+=-ay*.7*s;my+=ax*.7*s;}
 }
 const L=Math.hypot(mx,my)||1,spd=T.spd*e.spdMul*(busy?.2:1)*(e.type==='boss'&&e.hp<e.maxHp*.5?1.2:1);
 const ox=e.x,oy=e.y;e.x+=mx/L*spd*dt;e.y+=my/L*spd*dt;
 for(const o of G.enemies){if(o===e)continue;const ddx=e.x-o.x,ddy=e.y-o.y,dd=ddx*ddx+ddy*ddy,rr=e.r+o.r;if(dd<rr*rr&&dd>.01){const q=Math.sqrt(dd),push=(rr-q)*.5;e.x+=ddx/q*push;e.y+=ddy/q*push;}}
 resolve(e);
 e.mv+=Math.hypot(e.x-ox,e.y-oy);e.mvT+=dt;
 if(e.mvT>.7){if(e.mv<spd*.12&&d>e.pref+60&&!busy){e.stuck=.8;const a=Math.random()*6.283;e.sx=Math.cos(a);e.sy=Math.sin(a);}e.mv=0;e.mvT=0;}
 if(e.type==='boss'){bossAttack(e,dt,d);return;}
 if(e.burst>0){e.burstCd-=dt;if(e.burstCd<=0){shootE(e,e.aim+(Math.random()-.5)*T.spread*2,T.dmg*dmgScale(),T.bspd);SFX.enemyShot(.5);e.burst--;e.burstCd=.13;}}
 e.cd-=dt;
 if(e.windup>0){e.windup-=dt;if(e.windup>.12)e.aim=e.ang;if(e.windup<=0)enemyFire(e);}
 else if(e.cd<=0&&(e.los||T.bomb)&&d<(T.bomb?560:T.pref+330)){e.windup=e.snipe?1.3:T.wind;e.aim=e.ang;}
}

  roll:0,rollDur:.28,rollCd:0,rdx:1,rdy:0,iframe:0,walk:0,noHit:9,de:0,deOn:false,alt:false,flash:0,hurt:0,revived:false,whiskeyCd:0,tntCd:0,mounted:false};

function aimUpdate(){
 const p=G.player;
 if(input.touch){
  if(input.tAim)p.ang=input.tAng;
  else if(Math.hypot(input.mx,input.my)>.3&&!input.fire)p.ang=Math.atan2(input.my,input.mx);
  if(input.fire){
   let best=null,bd=.16;
   for(const e of G.enemies){const a=Math.atan2(e.y-p.y,e.x-p.x),df=Math.abs(((a-p.ang+Math.PI*3)%(Math.PI*2))-Math.PI);if(df<bd&&Math.hypot(e.x-p.x,e.y-p.y)<720){bd=df;best=a;}}
   if(best!==null)p.ang+=(((best-p.ang+Math.PI*3)%(Math.PI*2))-Math.PI)*.5;
  }
  G.aimX=p.x+Math.cos(p.ang)*260;G.aimY=p.y+Math.sin(p.ang)*260;
 }else{
  G.aimX=G.cam.x+input.mouse.x/G.scale;G.aimY=G.cam.y+input.mouse.y/G.scale;
  p.ang=Math.atan2(G.aimY-p.y,G.aimX-p.x);
 }
}
function shoot(){

 if(G.brawl){punch();return;}
 p.fireCd=st.cd;p.ammo[p.weapon]--;
 let side=0;if(W.dual){p.alt=!p.alt;side=p.alt?7:-7;}
 const mxo=p.x+Math.cos(p.ang)*(W.len+8)+Math.cos(p.ang+1.5708)*side,myo=p.y+Math.sin(p.ang)*(W.len+8)+Math.sin(p.ang+1.5708)*side;

  const sp=(p.deOn?st.spread*.25:st.spread)*(p.mounted?1.45:1)*(1+.18*(G.buzz||0)),a=p.ang+(Math.random()*2-1)*sp;
  const crit=Math.random()<S.crit+(p.deOn?.3:0),dmg=st.dmg*(crit?2.2:1)*(p.deOn?1.25:1)*(G.mb&&G.mb.venom?1.2:1),spd=st.speed*(.92+Math.random()*.16);
  G.bullets.push({x:mxo,y:myo,px:mxo,py:myo,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:st.range/spd,dmg,crit,pierce:st.pierce,hit:[]});
 }

 else{const sp=S.speed*(G.blizz>0?.85:1)*(input.fire&&W.slow?W.slow:1)*(p.reload>0?.93:1)*(p.mounted?HORSES[save.horse].mul:1);p.x+=mx*sp*dt;p.y+=my*sp*dt;resolve(p);p.walk+=Math.min(1,ml)*dt*11;if(ml>.3&&Math.random()<.08)dust(p.x,p.y+8,1);}
 p.vx=(p.x-ox)/Math.max(dt,.001);p.vy=(p.y-oy)/Math.max(dt,.001);
 p.iframe=Math.max(0,p.iframe-dt);p.rollCd=Math.max(0,p.rollCd-dt);p.whiskeyCd=Math.max(0,p.whiskeyCd-dt);p.tntCd=Math.max(0,p.tntCd-dt);
 p.hurt=Math.max(0,p.hurt-rdt);p.flash=Math.max(0,p.flash-rdt);

 if(p.reload>0){p.reload-=dt;if(p.reload<=0){p.reload=0;p.ammo[p.weapon]=st.mag;}}
 p.fireCd-=dt;
 if(input.fire&&p.roll<=0&&p.reload<=0&&p.fireCd<=0){if(p.ammo[p.weapon]>0)shoot();else startReload();}

function hurtPlayer(d){

 if(S.dodge&&Math.random()<S.dodge){ftext(p.x,p.y-24,'DODGED','#9fd0ff',16);return;}

function setupObjective(){
 G.obj=null;const w=G.forceW||save.wave;if(G.boss||G.brawl)return;
 const M=G.map,p=G.player;
 if(w%4===2){
  const bags=[];let tries=0;
  while(bags.length<4&&tries++<500){
   const x=rand(160,M.w-160),y=rand(300,M.h-300);
   if(M.obs.some(o=>x>o.x-34&&x<o.x+o.w+34&&y>o.y-34&&y<o.y+o.h+34))continue;
   if(Math.hypot(x-p.x,y-p.y)<300||bags.some(b=>Math.hypot(b.x-x,b.y-y)<360))continue;
   bags.push({x,y,got:false});
  }
  if(bags.length===4)G.obj={type:'heist',bags,got:0,t:95,closed:false,pay:Math.round(240*(1+w*.07))};
 }else if(w%4===0){
  G.obj={type:'coach',x:70,y:M.h/2,hp:100,done:false,dead:false,wheel:0,spawnT:7,halt:false};
 }else if(w%4===3){
  G.obj={type:'train',x:-560,y:M.h/2,cars:[{prog:0,done:false,on:false},{prog:0,done:false,on:false},{prog:0,done:false,on:false}],spawnT:6,over:false,looted:0,sp:62};
 }
}

 if(o.type==='heist')return o.closed?'Vault closed':'HEIST '+o.got+'/4 · '+Math.max(0,Math.ceil(o.t))+'s';
 if(o.type==='train')return o.over?'Train gone':'TRAIN '+o.looted+'/3';

 const o=G.obj;if(!o)return;const p=G.player;
 if(o.type==='heist'){
  if(o.closed)return;

  for(const b of o.bags){

  }

 }
 if(o.type==='train'){

  });

  o.spawnT-=dt;
  if(o.spawnT<=0&&G.toSpawn>0&&G.enemies.length<G.maxAlive+2){o.spawnT=6.5;G.enemies.push(makeEnemy(pickType(save.wave),clamp(o.x-rand(100,380),60,M2.w-60),o.y+rand(-170,170)));G.toSpawn--;}

 }
 if(o.dead||o.done)return;

function punch(){

 let hit=false;
 for(const e of G.enemies.slice()){
  const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d>66+e.r)continue;
  const da=Math.abs(((Math.atan2(dy,dx)-p.ang+Math.PI*3)%(Math.PI*2))-Math.PI);if(da>.95&&d>e.r+22)continue;
  const crit=Math.random()<S.crit+.1,dmg=(26+save.wave*.6)*S.dmgMul*(crit?2:1)*(p.deOn?1.4:1);
  damageEnemy(e,dmg,crit,e.x,e.y);e.x+=dx/d*22;e.y+=dy/d*22;resolve(e);hit=true;
 }

 dust(p.x+Math.cos(p.ang)*40,p.y+Math.sin(p.ang)*40,2);

 for(const o of G.enemies){if(o===e)continue;const ddx=e.x-o.x,ddy=e.y-o.y,dd=ddx*ddx+ddy*ddy,rr=e.r+o.r;if(dd<rr*rr&&dd>.01){const q=Math.sqrt(dd),push=(rr-q)*.5;e.x+=ddx/q*push;e.y+=ddy/q*push;}}
 resolve(e);e.cd-=dt;
 if(e.wind2>0){e.wind2-=dt;if(e.wind2<=0){if(d<80){hurtPlayer(12*dmgScale());G.shake=Math.max(G.shake,6);SFX.punch(true);}e.cd=rand(.9,1.5);}}

function replayDuel(){
 const L=LASTDUEL;if(!L)return;FIN().n.replays=(FIN().n.replays||0)+1;
 openFx('<h3 class="sh">Slow-motion replay</h3><canvas id="rpc" width="640" height="260"></canvas><div class="fxmsg" id="rpt">Steady...</div><div class="rowb"><button class="btn small" data-act="replay">Watch again</button><button class="btn small ghost" data-act="fxclose">Close</button></div>');
 const cv=document.getElementById('rpc');if(!cv)return;const c=cv.getContext('2d'),SLOW=.35;
 const tMe=L.drawn?(L.you+(L.fumble?550:0))/1000:99,tHim=L.him/1000;
 const shotMe=tMe+.12,shotHim=tHim+.12;
 const tw=L.won?Math.max(shotMe,(tHim<99?shotHim:0)+.1):Math.max(shotHim,(tMe<99?shotMe:0)+.1);
 const t0=performance.now()+1100;
 function fig(x,dir,drawAt,shotAt,fallAt,col,s){
  const fall=fallAt!=null&&s>fallAt?Math.min(1,(s-fallAt)/.25):0;
  c.save();c.translate(x,200);c.rotate(fall*dir*-1.45);
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,2,26,6,0,0,7);c.fill();
  c.strokeStyle='#2a1c12';c.lineWidth=6;c.beginPath();c.moveTo(-6,0);c.lineTo(-6,-34);c.moveTo(6,0);c.lineTo(6,-34);c.stroke();
  c.fillStyle=col;c.fillRect(-14,-82,28,50);
  c.fillStyle='#e0b48a';c.beginPath();c.arc(0,-92,10,0,7);c.fill();
  c.fillStyle='#3a2616';c.fillRect(-16,-98,32,5);c.fillRect(-10,-110,20,13);
  const drawn=s>=drawAt,k=drawn?Math.min(1,(s-drawAt)/.12):0;
  c.strokeStyle='#e0b48a';c.lineWidth=5;c.beginPath();c.moveTo(dir*8,-74);
  const ax=dir*(8+k*34),ay=-74+(1-k)*30;c.lineTo(ax,ay);c.stroke();
  if(drawn){c.fillStyle='#9aa4ab';c.fillRect(Math.min(ax,ax+dir*16),ay-3,16,5);}
  if(drawn&&s>=shotAt&&s<shotAt+.09){c.fillStyle='#ffd27a';c.beginPath();c.arc(ax+dir*22,ay,9,0,7);c.fill();}
  c.restore();
 }
 const iv=setInterval(()=>{
  const now=performance.now(),s=(now-t0)/1000*SLOW;
  c.clearRect(0,0,640,260);
  const g=c.createLinearGradient(0,0,0,260);g.addColorStop(0,'#e9b872');g.addColorStop(.7,'#c58a4a');g.addColorStop(.7,'#8e6236');g.addColorStop(1,'#6b4626');c.fillStyle=g;c.fillRect(0,0,640,260);
  const sig=s>=0&&s<.5;
  fig(150,1,tMe,shotMe,L.won?null:tw,'#4a6a8a',s);
  fig(490,-1,tHim,shotHim,L.won?tw:null,'#7a3a2a',s);
  c.font='700 20px "Special Elite",monospace';c.textAlign='center';c.fillStyle='#fff3d0';
  if(now<t0){c.fillText('Steady...',320,50);}
  else if(sig){c.fillStyle='#ffd23f';c.font='700 38px "Rye",serif';c.fillText('DRAW!',320,60);}
  c.font='700 16px "Special Elite",monospace';c.fillStyle='#fff3d0';
  if(s>=tMe&&tMe<99)c.fillText('You '+(L.you+(L.fumble?550:0))+' ms'+(L.fumble?' (fumbled)':''),150,38);
  if(s>=tHim)c.fillText(L.name.split(' ').pop()+' '+L.him+' ms',490,38);
  if(s>tw+.9){
   clearInterval(iv);fxSet('rpt',L.won?(tHim<tMe?'He was quicker on the draw, but you put him down.':'You were faster. He never cleared leather.'):(tMe<tHim?'You drew first, but he got you.':'He was faster by '+Math.abs(Math.round(tMe*1000-L.him))+' ms.'));
  }
 },30);
 FXT.push(iv);
}

const PAYS=[['Royal Flush',250],['Straight Flush',50],['Four of a Kind',25],['Full House',7],['Flush',5],['Straight',4],['Three of a Kind',3],['Two Pair',2],['Jacks or Better',1]];
function pkEval(h){
 const r=h.map(c=>c.r).sort((a,b)=>a-b),s=h.map(c=>c.s),flush=s.every(x=>x===s[0]);
 const cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);const cs=Object.values(cnt).sort((a,b)=>b-a);
 const straight=new Set(r).size===5&&(r[4]-r[0]===4||r.join()==='2,3,4,5,14');
 if(straight&&flush)return r[0]===10?['Royal Flush',250]:['Straight Flush',50];
 if(cs[0]===4)return['Four of a Kind',25];
 if(cs[0]===3&&cs[1]===2)return['Full House',7];
 if(flush)return['Flush',5];if(straight)return['Straight',4];
 if(cs[0]===3)return['Three of a Kind',3];
 if(cs[0]===2&&cs[1]===2)return['Two Pair',2];
 if(cs[0]===2){const pr=+Object.keys(cnt).find(k=>cnt[k]===2);if(pr>=11)return['Jacks or Better',1];}
 return['Nothing',0];
}
function pkDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}return d;}
function pkGo(){PK={bet:50,st:'bet',hand:[],held:[false,false,false,false,false],deck:[],msg:'Pick a stake and deal.',won:0};pkRender();}
function pkRender(){
 const P=PK;if(!P)return;
 let cards='<div class="pkrow">';
 for(let i=0;i<5;i++){
  const c=P.hand[i];
  if(!c){cards+='<div class="pcard back"></div>';continue;}
  const red=c.s===1||c.s===2;
  cards+=`<button class="pcard ${red?'red':''} ${P.held[i]?'hold':''}" data-act="pk_hold" data-i="${i}" ${P.st==='hold'?'':'disabled'}>${RANKL[c.r]||c.r}<small>${SUITS[c.s]}</small>${P.held[i]?'<em>HELD</em>':''}</button>`;
 }
 cards+='</div>';
 const bets=[25,50,100,250].map(b=>`<button class="btn small ${P.bet===b?'':'ghost'}" data-act="pk_bet" data-v="${b}" ${P.st==='hold'||save.money<b?'disabled':''}>${fmt(b)}</button>`).join('');
 const act=P.st==='hold'?'<button class="btn" data-act="pk_draw">Draw</button>':'<button class="btn" data-act="pk_deal" '+(save.money<P.bet?'disabled':'')+'>Deal '+fmt(P.bet)+'</button>';
 openFx('<h3 class="sh">The Gilded Spur · draw poker</h3>'+cards+'<div class="fxmsg" id="fxm">'+P.msg+'</div><div class="rowb">'+bets+'</div><div class="rowb">'+act+'<button class="btn ghost small" data-act="fxclose">Leave the table</button></div><div class="fxmsg">Cash '+fmt(save.money)+'</div><table class="lbt pay">'+PAYS.map(p=>`<tr><td>${p[0]}</td><td>${p[1]} to 1</td></tr>`).join('')+'</table>');
}
function pkAct(a,d){
 const P=PK;if(!P)return;
 if(a==='pk_bet'){P.bet=+d.v;SFX.click();pkRender();}
 else if(a==='pk_deal'){
  if(P.st==='hold'||!spend(P.bet))return;P.deck=pkDeck();P.hand=P.deck.splice(0,5);P.held=[false,false,false,false,false];P.st='hold';P.msg='Tap the cards to hold, then draw.';pkRender();
 }else if(a==='pk_hold'){P.held[+d.i]=!P.held[+d.i];SFX.click();pkRender();}
 else if(a==='pk_draw'){
  if(P.st!=='hold')return;
  for(let i=0;i<5;i++)if(!P.held[i])P.hand[i]=P.deck.shift();
  const r=pkEval(P.hand),win=P.bet*r[1],f=FIN();
  P.st='bet';P.held=[false,false,false,false,false];f.n.poker=(f.n.poker||0)+1;
  if(win>0){save.money+=win;save.earned+=Math.max(0,win-P.bet);SFX.bounty();P.msg=r[0]+'. You collect '+fmt(win)+'.';if(win-P.bet>(f.pokerBest||0))f.pokerBest=win-P.bet;if(r[0]==='Royal Flush')f.n.royal=1;}
  else{SFX.empty();P.msg='Nothing. The house takes it.';}
  writeSave();pkRender();
 }
}

function campAct(a,d){
 d=d||{};const f=FIN();
 switch(a){
  case'fish_go':fishGo();break;
  case'fish_btn':fishBtn();break;
  case'hunt_go':huntGo();break;
  case'hunt_tap':huntTap(d.i);break;
  case'pk_go':pkGo();break;
  case'pk_bet':case'pk_deal':case'pk_hold':case'pk_draw':pkAct(a,d);break;
  case'sell_goods':{const v=f.mats.hide*22+f.mats.meat*10+f.mats.fish*12;f.mats.hide=f.mats.meat=f.mats.fish=0;save.money+=v;save.earned+=v;SFX.bounty();G.cmsg='The butcher counts out '+fmt(v)+' for the lot.';writeSave();renderTown();break;}
  case'craft':{
   const r=RECIPES.find(x=>x.id===d.id);if(!r||!Object.keys(r.cost).every(k=>f.mats[k]>=r.cost[k]))break;
   for(const k in r.cost)f.mats[k]-=r.cost[k];f.items[r.id]=(f.items[r.id]||0)+1;f.n.crafted=(f.n.crafted||0)+1;SFX.buy();G.cmsg='You craft: '+r.n+'.';writeSave();renderTown();break;
  }
  case'use_bandage':{
   if(f.items.bandage<1||!(save.hp>0))break;S=calcStats();
   if(save.hp>=S.maxHp){toast('You are already in good shape.');break;}
   f.items.bandage--;save.hp=Math.min(S.maxHp,save.hp+40);G.cmsg='The bandage holds. Health '+Math.round(save.hp)+' of '+S.maxHp+'.';SFX.buy();writeSave();renderTown();break;
  }
  default:if(typeof folkAct==='function')folkAct(a,d);
 }
}

/* ---------- running a mission ---------- */
function startMission(m){
 if(G.quest||G.mission)return;
 const cp=CP(),idx=CAMP.indexOf(m);
 if(idx>cp.i&&!cp.done[m.id]){toast('Finish the earlier missions first.');return;}
 G.mission=m;G.mScene=TM.scene;G.mSaved={wave:save.wave,best:save.best};G.sceneBack=TM.scene;TM.scene=m.scene;saveTime();G.summary=null;
 showStory({id:'cb_'+m.id,title:(idx<0?'':'Mission '+(idx+1)+': ')+m.n,pages:m.brief},()=>launchMission(m));
}
function launchMission(m){
 if(G.mission!==m)return;
 save.wave=m.lvl;G.mLaunching=true;
 try{
  if(m.type==='hideout'){G.hideoutTry={id:'cm',n:m.n,men:m.men,mini:m.mini||0,reward:0};startWave();}
  else{G.forceW=m.type==='heist'?2:m.type==='coach'?4:m.type==='train'?3:1;startWave();G.forceW=0;}
 }catch(e){G.mLaunching=false;missionAbort();return;}
 G.mLaunching=false;
 if(m.extra&&!G.boss&&!G.hideout)G.toSpawn=Math.round(G.toSpawn*m.extra);
 if(m.evt&&!G.boss&&G.mode==='play')G.evt={type:m.evt,t:8};
 setTimeout(()=>{if(G.mission===m&&G.mode==='play')banner((CAMP.indexOf(m)<0?'':'MISSION '+(CAMP.indexOf(m)+1)+' · ')+m.n.toUpperCase(),'#e6b34a');},1400);
}
function missionAbort(){
 if(!G.mission)return;
 if(G.mSaved){save.wave=G.mSaved.wave;save.best=G.mSaved.best;}
 G.mission=null;G.mSaved=null;G.hideout=null;G.hideoutBox=null;
 if(G.mScene!=null){TM.scene=G.mScene;G.mScene=null;saveTime();}
}
function campFinale(){
 const cp=CP();cp.fin=1;
 const b=STORY.find(x=>x.id==='s12');
 showStory(b,()=>{G.tab='tale';setMode('town');renderTown();toast('The Long Ride is over. The valley is yours.');});
}

 const _fw=finishWave;

  _fw();
  if(!M||brawl)return;
  try{
   const cp=CP(),first=!cp.done[M.id],idx=CAMP.indexOf(M);
   save.wave=G.mSaved.wave;save.best=G.mSaved.best;G.mission=null;G.mSaved=null;if(G.mScene!=null){TM.scene=G.mScene;G.mScene=null;saveTime();}
   cp.done[M.id]=1;cp.i=Math.max(cp.i,idx+1);G.tab='tale';
   showStory({id:'cw_'+M.id,title:M.n+' complete',pages:M.win,choice:first?M.choice:null,reward:first?M.reward:0},()=>{
    if(idx===CAMP.length-1&&!cp.fin)campFinale();else{setMode('town');renderTown();}
   });
  }catch(e){}
 };
 const _go=realGameOver;

  const M=G.mission;
  _go();
  if(!M)return;

/* ---------- blackjack ---------- */
let BJ=null;
function bjCard(){return{r:2+Math.floor(Math.random()*13),s:Math.floor(Math.random()*4)};}
function bjVal(h){let t=0,a=0;for(const c of h){if(c.r===14){t+=11;a++;}else t+=c.r>=11?10:c.r;}while(t>21&&a>0){t-=10;a--;}return t;}
function bjGo(){BJ={bet:50,st:'bet',p:[],d:[],msg:'Pick a stake and deal. Blackjack pays 3 to 2.',base:50};bjRender();}
function bjCardHtml(c,hide){
 if(hide)return'<div class="pcard back"></div>';
 const red=c.s===1||c.s===2;return`<div class="pcard ${red?'red':''}">${RANKL[c.r]||c.r}<small>${SUITS[c.s]}</small></div>`;
}
function bjRender(){
 const B=BJ,play=B.st==='play';
 const bets=[25,50,100,250].map(b=>`<button class="btn small ${B.base===b?'':'ghost'}" data-act="bj_bet" data-v="${b}" ${play||save.money<b?'disabled':''}>${fmt(b)}</button>`).join('');
 const acts=play?`<button class="btn" data-act="bj_hit">Hit</button><button class="btn" data-act="bj_stand">Stand</button><button class="btn ghost" data-act="bj_double" ${B.p.length===2&&save.money>=B.bet?'':'disabled'}>Double</button>`:`<button class="btn" data-act="bj_deal" ${save.money<B.base?'disabled':''}>Deal ${fmt(B.base)}</button>`;
 openFx('<h3 class="sh">Blackjack at the Spur</h3><div class="fxmsg">Dealer'+(B.d.length?' · '+(play?'?':bjVal(B.d)):'')+'</div><div class="pkrow">'+B.d.map((c,i)=>bjCardHtml(c,play&&i===1)).join('')+'</div><div class="fxmsg">You'+(B.p.length?' · '+bjVal(B.p):'')+'</div><div class="pkrow">'+B.p.map(c=>bjCardHtml(c)).join('')+'</div><div class="fxmsg" id="fxm">'+B.msg+'</div><div class="rowb">'+bets+'</div><div class="rowb">'+acts+'<button class="btn ghost small" data-act="fxclose">Leave</button></div><div class="fxmsg">Cash '+fmt(save.money)+'</div>');
}
function bjEnd(result){
 const B=BJ;B.st='bet';let win=0;
 if(result==='bj'){win=Math.round(B.bet*2.5);B.msg='Blackjack! Pays '+fmt(win)+'.';}
 else if(result==='win'){win=B.bet*2;B.msg='You win '+fmt(win)+'.';}
 else if(result==='push'){win=B.bet;B.msg='Push. Your stake comes back.';}
 else B.msg=result==='bust'?'Bust. The house wins.':'The dealer wins.';
 if(win>0){save.money+=win;if(win>B.bet)save.earned+=win-B.bet;if(win>B.bet)SFX.bounty();}else SFX.empty();
 const f=FIN();f.n.bj=(f.n.bj||0)+1;writeSave();bjRender();
}
function bjAct(a,d){
 const B=BJ;if(!B)return;
 if(a==='bj_bet'){B.base=+d.v;B.msg='Stake set.';bjRender();return;}
 if(a==='bj_deal'){
  if(B.st==='play'||!spend(B.base))return;B.bet=B.base;B.p=[bjCard(),bjCard()];B.d=[bjCard(),bjCard()];B.st='play';B.msg='Hit, stand or double.';
  const pb=bjVal(B.p)===21,db=bjVal(B.d)===21;
  if(pb||db){bjEnd(pb&&db?'push':pb?'bj':'lose');return;}
  bjRender();return;
 }
 if(B.st!=='play')return;
 if(a==='bj_hit'){B.p.push(bjCard());if(bjVal(B.p)>21){bjEnd('bust');return;}if(bjVal(B.p)===21){bjAct('bj_stand');return;}bjRender();return;}
 if(a==='bj_double'){if(B.p.length!==2||!spend(B.bet))return;B.bet*=2;B.p.push(bjCard());if(bjVal(B.p)>21){bjEnd('bust');return;}bjAct('bj_stand');return;}
 if(a==='bj_stand'){
  while(bjVal(B.d)<17)B.d.push(bjCard());
  const pv=bjVal(B.p),dv=bjVal(B.d);
  bjEnd(dv>21||pv>dv?'win':pv===dv?'push':'lose');
 }
}

 RO={n:0,ok:0,pos:0,dir:1,spd:1.6,zone:.3,zs:.3};
 openFx('<h3 class="sh">Dust Creek Rodeo</h3><div class="fxmsg" id="fxm">Eight seconds on a furious bull. Tap Hold on while the marker is in the green. Eight rounds.</div><div class="fbar"><i class="fz" id="fz"></i><b class="fm" id="fm"></b></div><div class="rowb"><button class="btn" id="fxb" data-act="ro_tap">Hold on</button><button class="btn ghost small" data-act="fxclose">Quit</button></div>');
 roZone();
 const iv=setInterval(()=>{if(!RO||RO.n>=8){clearInterval(iv);return;}RO.pos+=RO.dir*RO.spd*.03;if(RO.pos>=1){RO.pos=1;RO.dir=-1;}if(RO.pos<=0){RO.pos=0;RO.dir=1;}const m=document.getElementById('fm');if(m)m.style.left=(RO.pos*100)+'%';},30);FXT.push(iv);
}
function roZone(){RO.zs=.05+Math.random()*(.9-RO.zone);const z=document.getElementById('fz');if(z){z.style.left=(RO.zs*100)+'%';z.style.width=(RO.zone*100)+'%';}}
function roTap(){
 if(!RO||RO.n>=8)return;
 const hit=Math.abs(RO.pos-(RO.zs+RO.zone/2))<=RO.zone/2;
 if(!hit){
  const v=RO.ok*35;save.money+=v;save.earned+=v;RO.n=8;writeSave();SFX.empty();
  fxSet('fxm','You are thrown after '+RO.ok+' of 8 rounds. The crowd pays you '+fmt(v)+'.');
  const b=document.getElementById('fxb');if(b){b.disabled=true;b.textContent='Done';}return;
 }
 RO.ok++;RO.n++;SFX.click();RO.spd+=.35;RO.zone=Math.max(.14,RO.zone-.025);
 if(RO.n<8){roZone();fxSet('fxm','Still on. Round '+(RO.n+1)+' of 8.');return;}
 const v=700;save.money+=v;save.earned+=v;FIN().n.rodeo=(FIN().n.rodeo||0)+1;addXp(40);writeSave();SFX.bounty();
 fxSet('fxm','Eight seconds. The judges award you the purse of '+fmt(v)+'.');
 const b=document.getElementById('fxb');if(b){b.disabled=true;b.textContent='Done';}
}

/* ---------- mining ---------- */
let MN=null;
function mineGo(){
 const f=FIN();if(f.trips<1)return;f.trips--;
 const cells=[];for(let i=0;i<25;i++){const r=Math.random();cells.push(r<.12?'tnt':r<.2?'gem':r<.38?'gold':r<.62?'silver':'dirt');}
 MN={cells,open:Array(25).fill(false),picks:7,gain:0,msg:'Seven swings of the pick. Watch for dynamite.'};mineRender();
}
const MV={dirt:0,silver:25,gold:70,gem:220,tnt:0},ML={dirt:'Dirt',silver:'Silver',gold:'Gold',gem:'Gem',tnt:'Dynamite'};
function mineRender(){
 let g='<div class="mgrid">';
 for(let i=0;i<25;i++){const o=MN.open[i];g+=`<button class="mcell ${o?'o m_'+MN.cells[i]:''}" data-act="mine_dig" data-i="${i}" ${o||MN.picks<1?'disabled':''}>${o?ML[MN.cells[i]]:''}</button>`;}
 g+='</div>';
 openFx('<h3 class="sh">Ironvein Shaft</h3><div class="fxmsg" id="fxm">'+MN.msg+'</div>'+g+'<div class="fxmsg">Picks left '+MN.picks+' · Haul '+fmt(MN.gain)+'</div><div class="rowb"><button class="btn small" data-act="mine_done">'+(MN.picks<1?'Sell the haul':'Cash out early')+'</button></div>');
}
function mineDig(i){
 if(!MN||MN.picks<1||MN.open[i])return;
 MN.open[i]=true;MN.picks--;const t=MN.cells[i];
 if(t==='tnt'){MN.gain=Math.floor(MN.gain/2);MN.msg='Dynamite! You lose half your haul.';SFX.empty();}
 else{MN.gain+=MV[t];MN.msg=t==='dirt'?'Just dirt.':'You strike '+ML[t].toLowerCase()+'.';SFX.click();}
 mineRender();
}
function mineDone(){
 if(!MN)return;const v=MN.gain;MN=null;
 if(v>0){save.money+=v;save.earned+=v;addXp(8);SFX.bounty();FIN().n.mined=(FIN().n.mined||0)+1;writeSave();toast('Ore sold for '+fmt(v)+'.');}
 closeFx();renderTown();
}

const CFIRST=['Slim','Dirty','Blind','Crooked','Black','Quick','Silent','Red'],CLAST=['Tom Harlan','Ned Burke','Sal Ortega','Joe Pike','Lyle Dunne','Ike Marsh','Abe Colter','Hank Rudd'];
function contractsList(){
 const seed=Math.floor((save.wave||1)/2)+(save.kills||0)%3,o=[];
 for(let i=0;i<3;i++){const a=(seed*3+i*5)%CFIRST.length,b=(seed*7+i*3)%CLAST.length;o.push({id:i,name:CFIRST[a]+' '+CLAST[b],pay:Math.round((350+save.wave*85)*(1+i*.4))});}
 return o;
}
let CT=null;
function contractClue(){
 const wrong=Math.floor(Math.random()*3);CT.good=wrong;
 const opts=['East along the creek','Into the pines','Toward the old well'];
 openFx('<h3 class="sh">Tracking '+CT.c.name+'</h3><div class="fxmsg" id="fxm">Clue '+(CT.step+1)+' of 3. Fresh boot prints, a snapped twig and a cold fire. Which way did he go?</div><div class="rowb">'+opts.map((t,i)=>`<button class="btn small" data-act="ct_pick" data-i="${i}">${t}</button>`).join('')+'</div><div class="fxmsg">Reward '+fmt(CT.pay)+'</div>');
}
function contractPick(i){
 if(!CT)return;
 if(i===CT.good){CT.pay=Math.round(CT.pay*1.3);SFX.click();}else{SFX.empty();}
 CT.step++;
 if(CT.step<3){contractClue();return;}
 const pc={name:CT.c.name,pay:CT.pay};CT=null;closeFx();
 G.summary=null;G.pc=pc;G.forceW=1;startWave();G.forceW=0;
}

}
function detailHtml(id){
 const n=SK[id],lv=save.skills[id]||0,locked=n.p&&!(save.skills[n.p]>0),max=lv>=n.max,cost=max?0:skCost(id);
 const br=BR.find(x=>x.id===n.b);
 return `<div class="detail" style="--bc:${br.col}"><div class="dh"><h4>${n.n}</h4><span class="rk">Rank ${lv} of ${n.max}</span></div><p>${n.d}</p>${locked?'<p class="need">Needs '+SK[n.p].n+' first.</p>':''}<div class="rowb"><button class="btn" data-act="skill" ${(locked||max||skPoints()<cost)?'disabled':''}>${max?'Maxed out':'Train · '+cost+(cost===1?' point':' points')}</button></div></div>`;
}
function skillsHtml(){
 const br=BR.find(b=>b.id===G.branch),ids=Object.keys(SK).filter(i=>SK[i].b===br.id);
 if(!SK[G.sel]||SK[G.sel].b!==br.id)G.sel=ids[0];
 let cells='';
 for(let r=0;r<5;r++)for(let c=0;c<3;c++){const id=ids.find(i=>SK[i].r===r&&SK[i].c===c);cells+=id?nodeHtml(id):'<div></div>';}
 return `<div class="brs">${BR.map(b=>{const ids2=Object.keys(SK).filter(i=>SK[i].b===b.id),got=ids2.reduce((a,i)=>a+(save.skills[i]||0),0),tot=ids2.reduce((a,i)=>a+SK[i].max,0);return `<button data-act="branch" data-v="${b.id}" class="${b.id===G.branch?'on':''}" style="--bc:${b.col}"><b>${b.name}</b><small>${got} of ${tot} ranks</small></button>`;}).join('')}</div>
 <div class="tgrid" id="tgrid" style="--bc:${br.col}">${cells}<svg id="tsvg"></svg></div>${detailHtml(G.sel)}`;
}
function drawTreeLines(){
 const g=$('#tgrid'),svg=$('#tsvg');if(!g||!svg)return;
 const gr=g.getBoundingClientRect();let h='';
 g.querySelectorAll('.tnode').forEach(n=>{
  const id=n.dataset.id,p=SK[id].p;if(!p)return;
  const pe=g.querySelector('[data-id="'+p+'"]');if(!pe)return;
  const a=pe.getBoundingClientRect(),b=(n.querySelector('.med')||n).getBoundingClientRect();
  const x1=a.left+a.width/2-gr.left,y1=a.bottom-gr.top+4,x2=b.left+b.width/2-gr.left,y2=b.top-gr.top-9,my=(y1+y2)/2;
  h+=`<path class="${(save.skills[p]||0)>0?'on':''}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`;
 });
 svg.setAttribute('viewBox','0 0 '+gr.width+' '+gr.height);svg.innerHTML=h;
}
function gunsHtml(){
 return '<div class="grid">'+WORDER.filter(id=>!WEAPONS[id].legend||save.weapons[id]!==undefined).map(id=>{
  const w=WEAPONS[id],own=save.weapons[id]!==undefined,L=save.weapons[id]||0,eq=save.weapon===id;
  const bars=[['Power',w.dmg*w.pellets*(1+L*.12)/(WMAX.pow*1.36)],['Speed',(1/w.rate)/WMAX.spd],['Reload',(1/w.reload)/WMAX.rel],['Rounds',w.mag/WMAX.mag]];
  const stat=bars.map(b=>`<div class="stat"><span>${b[0]}</span><i><u style="width:${Math.round(Math.min(1,Math.sqrt(b[1]))*100)}%"></u></i></div>`).join('');
  let btns='';
  if(!own)btns=`<button class="btn small" data-act="gbuy" data-id="${id}" ${save.money<w.cost?'disabled':''}>Buy · ${fmt(w.cost)}</button>`;
  else{btns=`<button class="btn small${eq?' ghost':''}" data-act="gequip" data-id="${id}" ${eq?'disabled':''}>${eq?'Equipped':'Equip'}</button>`;
   if(L<3){const tc=tuneCost(id,L);btns+=`<button class="btn small ghost" data-act="gtune" data-id="${id}" ${save.money<tc?'disabled':''}>Tune ${L+1} · ${fmt(tc)}</button>`;}
   else btns+=`<button class="btn small ghost" disabled>Fully tuned</button>`;}
  return `<div class="card${eq?' eq':''}"><h4><span>${w.name}</span><span class="price">${own?'Tune '+L+'/3':''}</span></h4><p>${w.desc}</p>${stat}<div class="rowb">${btns}</div></div>`;
 }).join('')+'</div>';
}
function wearHtml(){
 let h=`<div class="card"><p>Health <span class="price">${S.maxHp}</span> · Damage taken <span class="price">-${Math.round(S.armor*100)}%</span> · Speed <span class="price">${Math.round(S.speed)}</span> · Bounty <span class="price">x${S.bounty.toFixed(2)}</span> · Loot <span class="price">x${S.loot.toFixed(2)}</span></p></div>`;
 for(const sl of SLOTS){
  h+=`<h3 class="sh">${sl[1]}</h3><div class="grid">`+GEAR.filter(g=>g.slot===sl[0]).map(g=>{
   const own=save.gearOwned[g.id],eq=save.equip[sl[0]]===g.id;
   const b=own?`<button class="btn small${eq?' ghost':''}" data-act="wequip" data-id="${g.id}" ${eq?'disabled':''}>${eq?'Wearing':'Wear'}</button>`:`<button class="btn small" data-act="wbuy" data-id="${g.id}" ${save.money<g.cost?'disabled':''}>Buy</button>`;
   return `<div class="card${eq?' eq':''}"><h4><span>${g.name}</span><span class="price">${own?'':fmt(g.cost)}</span></h4><p>${g.d}</p><div class="rowb">${b}</div></div>`;
  }).join('')+'</div>';
 }
 return h;
}
function shopHtml(){
 const hp=save.hp>0?Math.min(S.maxHp,save.hp):S.maxHp,miss=Math.ceil(S.maxHp-hp),doc=Math.round(miss*1.8);
 const row=(name,desc,price,act,dis,label)=>`<div class="card"><h4><span>${name}</span><span class="price">${fmt(price)}</span></h4><p>${desc}</p><div class="rowb"><button class="btn small" data-act="${act}" ${dis?'disabled':''}>${label||'Buy'}</button></div></div>`;
 return '<div class="grid">'+
  row('Whiskey','Heals 45 health in a fight. You carry '+save.inv.whiskey+' of '+S.whiskeyCap+'.',60,'buy_whiskey',save.money<60||save.inv.whiskey>=S.whiskeyCap)+
  row('Dynamite','Throw it to blast a crowd. You carry '+save.inv.dynamite+' of '+S.dynCap+'.',85,'buy_dyn',save.money<85||save.inv.dynamite>=S.dynCap)+
  row('Doc Hartley','Patches you up to full health. Missing '+miss+' health.',doc,'buy_doc',miss<=0||save.money<doc,'Heal')+
  row('Wanted Posters','Next wave, every bounty pays 25% more.'+(save.buffs.posters?' Already posted.':''),225,'buy_posters',!!save.buffs.posters||save.money<225)+
  row('Snake Oil','Next wave starts with a full Dead Eye meter.'+(save.buffs.oil?' Already bottled.':''),180,'buy_oil',!!save.buffs.oil||save.money<180)+'</div>'+extraStoreHtml()+merchHtml();
}
function renderTown(){
 S=calcStats();
 const el=$('#sTown'),old=el.querySelector('.tbody'),st=old?old.scrollTop:0;
 const hp=Math.round(save.hp>0?Math.min(S.maxHp,save.hp):S.maxHp);
 const tabs=[['tale','Story'],['skills','Skills'],['guns','Guns'],['wear','Wardrobe'],['shop','Store'],['town','Town'],['tavern','Tavern'],['camp','Camp'],['folk','Folk'],['dlc','Packs'],['stats','Log'],['opts','Options']];
 const body=G.tab==='tale'?taleHtml():G.tab==='skills'?skillsHtml():G.tab==='guns'?gunsHtml():G.tab==='wear'?wearHtml():G.tab==='shop'?shopHtml():G.tab==='town'?townHtml():G.tab==='tavern'?tavernHtml():G.tab==='camp'?campHtml():G.tab==='folk'?folkHtml():G.tab==='dlc'?dlcHtml():G.tab==='opts'?optsHtml():statsHtml();
 el.innerHTML=`<div class="thead"><h2>Dust Creek · Wave ${save.wave} next</h2><div class="m">${fmt(save.money)}</div><div class="h">${fmtClock(TM.h)} · Health ${hp}/${S.maxHp} · ${rankInfo().name}</div></div>
 <div class="tabs">${tabs.map(t=>`<button data-act="tab" data-v="${t[0]}" class="${G.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
 <div class="tbody scroll">${G.summary?sumHtml():''}${body}</div>
 <div class="tfoot"><button class="btn" data-act="duelgo">Duel</button><button class="btn" data-act="ride">Open Field · Wave ${save.wave}</button><button class="btn ghost" data-act="menu">Menu</button></div>`;
 const nb=el.querySelector('.tbody');if(nb)nb.scrollTop=st;
 if(G.tab==='skills')requestAnimationFrame(drawTreeLines);
 requestAnimationFrame(()=>{const t=document.querySelector('.tabs button.on');if(t&&t.scrollIntoView)try{t.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}});
}
function renderOver(){
 if(save.jailed){jailOver();return;}
 const o=G.overInfo;
 $('#sOver').innerHTML=`<div class="panel"><h2>Gunned Down</h2><p>You fell on wave ${o.wave} after ${o.kills} kill${o.kills===1?'':'s'}.</p><p>Bounties ${fmt(o.bounty)} · Pockets ${fmt(o.pockets)}</p><p style="color:var(--red)">The undertaker took ${fmt(o.loss)} from your pockets.</p><button class="btn" data-act="townback">Back to town</button></div>`;
}
function renderPause(){
 $('#sPause').innerHTML=`<div class="panel"><h2>Paused</h2><button class="btn" data-act="resume">Resume</button><button class="btn ghost" data-act="music">Music: ${settings.music?'on':'off'}</button><button class="btn ghost" data-act="sfx">Sound effects: ${settings.sfx?'on':'off'}</button><button class="btn ghost" data-act="tmode">Time: ${TMLABEL[TM.mode]} · ${fmtClock(TM.h)}</button><button class="btn ghost" data-act="scene">Next scenery: ${sceneLabel()}</button><button class="btn ghost" data-act="track">Soundtrack: ${trackLabel()}</button><button class="btn ghost" data-act="abandon">Abandon wave</button></div>`;
}
function pauseGame(){if(G.mode!=='play')return;writeSave();setMode('pause');renderPause();}
function resumeGame(){if(G.mode!=='pause')return;setMode('play');}

/* ---------- boss duel ---------- */
let duelT=null,duelState='',duelStart=0;
function startDuel(){
 setMode('duel');
 const r=save.role,fac=r==='sheriff'?'outlaw':r==='outlaw'?'law':(Math.random()<.5?'outlaw':'rustler');
 G.duelFac=fac==='rustler'?'outlaw':fac;
 G.duelName=storyBossName()||pick(G.duelFac==='law'?BOSS_LAW:BOSS_OUT);
 G.duelBounty=Math.round(rand(1200,1500)*(1+(save.wave/5-1)*.35)*S.bossBounty);
 $('#sDuel').innerHTML=`<div class="poster"><h2>${G.duelFac==='law'?'THE LAW':'WANTED'}</h2><div class="nm">${G.duelName}</div><div class="bn">${fmt(G.duelBounty)}</div><p>Steps into the street and calls you out. Wait for the signal, then draw.</p></div>
 <button id="drawBtn" data-act="draw">Steady...</button><div class="msg" id="duelMsg">Tap too early and he gets the edge.</div>`;
 duelState='wait';clearTimeout(duelT);
 duelT=setTimeout(()=>{if(duelState!=='wait')return;duelState='go';duelStart=performance.now();const b=$('#drawBtn');if(b){b.classList.add('go');b.textContent='DRAW!';}SFX.draw();},1500+Math.random()*2200);
}
function duelDraw(){
 if(G.mode!=='duel'||duelState==='done')return;
 const msg=$('#duelMsg'),p=G.player;
 if(duelState==='wait'){clearTimeout(duelT);duelState='done';msg.textContent='Too early! He gets the drop on you.';p.hp=Math.max(10,p.hp-15);}
 else{
  const rt=Math.round(performance.now()-duelStart);duelState='done';
  if(rt<420){G.duelMul=.65;p.de=100;msg.textContent='Lightning fast, '+rt+' ms. He starts wounded and your Dead Eye is full.';}
  else if(rt<800){G.duelMul=.85;msg.textContent=rt+' ms. You nick him before the fight starts.';}
  else{msg.textContent=rt+' ms. Too slow. He shoots first.';p.hp=Math.max(10,p.hp-15);}
 }
 setTimeout(()=>{if(G.mode==='duel')beginPlay();},1700);
}

/* ---------- actions ---------- */
function act(a,d){
 switch(a){
  case'continue':G.titleStage='modes';renderTitle();break;
  case'new':G.titleStage='roles';renderTitle();break;
  case'back':G.titleStage='main';renderTitle();break;
  case'role':save=freshSave(d.role);writeSave();G.summary=null;G.tab='skills';G.branch='gun';G.sel='g1';G.titleStage='modes';renderTitle();break;
  case'ride':G.summary=null;storyThen(()=>trailEvent(()=>startWave()));break;
  case'townhub':G.summary=null;setMode('town');renderTown();break;
  case'menu':writeSave();G.titleStage='modes';renderTitle();setMode('title');break;
  case'duelgo':case'dfnext':startDuelMode();break;
  case'dfface':dfFace();break;
  case'dftown':G.summary=null;setMode('town');renderTown();break;
  case'dfsteady':dfSteady();break;
  case'dfwhisk':dfWhiskey();break;
  case'music':settings.music=!settings.music;saveSettings();applyAudio();if(G.mode==='pause')renderPause();else renderTitle();break;
  case'sfx':settings.sfx=!settings.sfx;saveSettings();applyAudio();if(G.mode==='pause')renderPause();else renderTitle();break;
  case'tmode':cycleTime();if(G.mode==='pause')renderPause();else renderTitle();break;
  case'scene':cycleScene();if(G.mode==='pause')renderPause();else renderTitle();break;
  case'tab':G.tab=d.v;G.summary=null;renderTown();break;
  case'branch':G.branch=d.v;renderTown();break;
  case'sel':G.sel=d.id;renderTown();break;
  case'skill':{const id=G.sel,n=SK[id],lv=save.skills[id]||0;if(lv>=n.max)break;if(n.p&&!(save.skills[n.p]>0)){toast('Requires '+SK[n.p].n);break;}if(skPoints()<skCost(id)){toast('Not enough skill points. You gain 2 every rank up.');break;}save.skills[id]=lv+1;SFX.buy();writeSave();renderTown();break;}
  case'gbuy':if(spend(WEAPONS[d.id].cost)){save.weapons[d.id]=0;save.weapon=d.id;writeSave();renderTown();}break;
  case'gequip':save.weapon=d.id;SFX.click();writeSave();renderTown();break;
  case'gtune':{const L=save.weapons[d.id]||0;if(L<3&&spend(tuneCost(d.id,L))){save.weapons[d.id]=L+1;writeSave();renderTown();}break;}
  case'wbuy':{const g=GEARBY[d.id];if(spend(g.cost)){save.gearOwned[g.id]=1;save.equip[g.slot]=g.id;writeSave();renderTown();}break;}
  case'wequip':{const g=GEARBY[d.id];save.equip[g.slot]=g.id;SFX.click();writeSave();renderTown();break;}
  case'buy_whiskey':if(save.inv.whiskey<S.whiskeyCap&&spend(60)){save.inv.whiskey++;writeSave();renderTown();}break;
  case'buy_dyn':if(save.inv.dynamite<S.dynCap&&spend(85)){save.inv.dynamite++;writeSave();renderTown();}break;
  case'buy_doc':{const hp=save.hp>0?Math.min(S.maxHp,save.hp):S.maxHp,cost=Math.round(Math.ceil(S.maxHp-hp)*1.8);if(cost>0&&spend(cost)){save.hp=S.maxHp;writeSave();renderTown();}break;}
  case'buy_posters':if(!save.buffs.posters&&spend(225)){save.buffs.posters=1;writeSave();renderTown();}break;
  case'buy_oil':if(!save.buffs.oil&&spend(180)){save.buffs.oil=1;writeSave();renderTown();}break;
  case'townback':G.summary=null;setMode('town');renderTown();break;
  case'pause':pauseGame();break;
  case'resume':resumeGame();break;
  case'abandon':if(typeof missionAbort==='function')missionAbort();save.kills+=G.stats?G.stats.kills:0;writeSave();G.summary=null;setMode('town');renderTown();break;
  case'draw':duelDraw();break;
  default:extraAct(a,d);
 }
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 audioInit();act(b.dataset.act,b.dataset);
});

/* ---------- keyboard and mouse ---------- */
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();input.keys[k]=true;
 if(G.mode==='duel'&&(k===' '||k==='enter')){e.preventDefault();audioInit();duelDraw();return;}
 if(G.mode==='play'){
  if(k===' '){e.preventDefault();doRoll();}
  else if(k==='r')startReload();
  else if(k==='q'||k==='shift')doDeadEye();
  else if(k==='e')useDynamite();
  else if(k==='h')useWhiskey();
  else if(k==='f')toggleMount();
  else if(k==='t')throwKnife();
  else if(k==='c')flipCover();
  else if(k==='l')throwRope();
  else if(k==='b')throwFire();
  else if(k==='k')kickDoor();
  else if(k>='1'&&k<='9'&&k.length===1)pickWeapon(+k-1);
  else if(k==='escape'||k==='p')pauseGame();
  else if(k==='tab'){e.preventDefault();cycleWeapon(1);}
  if(k.indexOf('arrow')===0)e.preventDefault();
 }else if(G.mode==='pause'&&(k==='escape'||k==='p'))resumeGame();
});
addEventListener('keyup',e=>{input.keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{input.keys={};if(G.mode==='play'){input.fire=false;pauseGame();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.mode==='play')pauseGame();else if(save)writeSave();}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function setTouchMode(on){input.touch=on;$('#touch').hidden=!(on&&G.mode==='play');}
cv.addEventListener('pointermove',e=>{
 if(e.pointerType!=='mouse')return;
 const r=cv.getBoundingClientRect();input.mouse.x=e.clientX-r.left;input.mouse.y=e.clientY-r.top;
 if(input.touch)setTouchMode(false);
});
cv.addEventListener('pointerdown',e=>{
 if(e.pointerType!=='mouse'||e.button!==0)return;
 const r=cv.getBoundingClientRect();input.mouse.x=e.clientX-r.left;input.mouse.y=e.clientY-r.top;
 audioInit();if(G.mode==='play')input.fire=true;
});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')input.fire=false;});
document.addEventListener('touchstart',()=>{if(!input.touch)setTouchMode(true);},{passive:true});

/* ---------- touch sticks and buttons ---------- */
const TS={L:null,R:null},touchEl=$('#touch');
function showStick(id,x,y){const el=$('#'+id);el.classList.add('on');el.style.left=(x-62)+'px';el.style.top=(y-62)+'px';el.firstElementChild.style.transform='translate(0,0)';}
function resetSticks(){
 TS.L=null;TS.R=null;input.stick=false;input.tAim=false;
 for(const id of['stkL','stkR']){const el=$('#'+id);if(el)el.classList.remove('on');}
}
function stickVec(s,e,max){
 let nx=(e.clientX-s.ox)/max,ny=(e.clientY-s.oy)/max;const l=Math.hypot(nx,ny);if(l>1){nx/=l;ny/=l;}return[nx,ny,Math.min(1,l)];
}
touchEl.addEventListener('pointerdown',e=>{
 if(e.target.closest('button')||G.mode!=='play')return;
 e.preventDefault();audioInit();
 const left=e.clientX<innerWidth/2;if(left?TS.L:TS.R)return;
 const s={id:e.pointerId,ox:e.clientX,oy:e.clientY};
 if(left){TS.L=s;showStick('stkL',s.ox,s.oy);input.stick=true;input.mx=0;input.my=0;}
 else{TS.R=s;showStick('stkR',s.ox,s.oy);input.fire=true;input.tAim=false;}
 try{touchEl.setPointerCapture(e.pointerId);}catch(err){}
});
touchEl.addEventListener('pointermove',e=>{
 for(const side of['L','R']){
  const s=TS[side];if(!s||s.id!==e.pointerId)continue;
  const v=stickVec(s,e,56),el=$(side==='L'?'#stkL':'#stkR');
  el.firstElementChild.style.transform='translate('+(v[0]*56)+'px,'+(v[1]*56)+'px)';
  if(side==='L'){if(v[2]<.12){input.mx=0;input.my=0;}else{input.mx=v[0];input.my=v[1];}}
  else if(v[2]>.18){input.tAng=Math.atan2(v[1],v[0]);input.tAim=true;}
 }
});
function touchEnd(e){
 if(TS.L&&TS.L.id===e.pointerId){TS.L=null;input.stick=false;input.mx=0;input.my=0;$('#stkL').classList.remove('on');}
 if(TS.R&&TS.R.id===e.pointerId){TS.R=null;input.fire=false;input.tAim=false;$('#stkR').classList.remove('on');}
}
touchEl.addEventListener('pointerup',touchEnd);touchEl.addEventListener('pointercancel',touchEnd);
const bindBtn=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();if(G.mode==='play')fn();});
bindBtn('#bMount',toggleMount);bindBtn('#bKnife',throwKnife);bindBtn('#bCover',flipCover);bindBtn('#bRope',throwRope);bindBtn('#bKick',kickDoor);bindBtn('#bFire',throwFire);bindBtn('#bRoll',doRoll);bindBtn('#bRel',startReload);bindBtn('#bDE',doDeadEye);bindBtn('#bDyn',useDynamite);bindBtn('#bWhi',useWhiskey);bindBtn('#bSwap',()=>cycleWeapon(1));

/* ---------- loop ---------- */
let lastTs=0;
function frame(ts){
 requestAnimationFrame(frame);
 const rdt=Math.min(.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
 if(G.mode!=='pause')tickClock(rdt);
 musicAuto(rdt);
 if(G.mode==='play')update(rdt);
 if(G.mode==='dfight'){dfUpdate(rdt);dfRender();}
 else if(G.mode==='play'||G.mode==='pause'||G.mode==='duel'){render();if(G.mode!=='duel')hud();}
}
function init(){
 save=loadSave();
 try{if(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches)input.touch=true;}catch(e){}
 resize();addEventListener('resize',resize);
 renderTitle();setMode('title');
 requestAnimationFrame(frame);
}
init();

</script>
</body></html>
